<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFTF & RORO</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage:       #7A9E76;
    --sage-light: #A8C4A4;
    --sage-pale:  #D4E6D1;
    --cream:      #F7F3EA;
    --cream-dark: #EDE7D9;
    --text:       #2E3D2C;
    --text-light: #7A9170;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8e2d4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px 20px 50px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .page-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--sage);
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .page-sub {
    font-size: 13px;
    color: #8a9e88;
    text-align: center;
    margin-bottom: 36px;
    font-style: italic;
  }

  /* Phone */
  .phone {
    width: 340px;
    height: 700px;
    background: var(--cream);
    border-radius: 46px;
    border: 2px solid #c8c0b0;
    box-shadow:
      0 0 0 1px #b8b0a0,
      0 40px 80px rgba(0,0,0,0.25),
      0 10px 30px rgba(0,0,0,0.12);
    overflow: hidden;
    position: relative;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px;
    background: var(--cream);
    border-radius: 0 0 22px 22px;
    z-index: 200;
    border-bottom: 1px solid var(--cream-dark);
  }

  .screen { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--cream); }

  /* ── HERO SPLIT ── */
  .split {
    width: 100%;
    height: 58%;
    display: flex;
    position: relative;
  }

  .half { position: relative; overflow: hidden; flex: 1; }
  .half img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.85) brightness(0.88); }
  .half.left  img { object-position: 60% center; }
  .half.right img { object-position: 40% center; }

  /* Light sage fade from center and bottom */
  .half.left::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, rgba(247,243,234,0) 0%, rgba(247,243,234,0.18) 100%),
      linear-gradient(to bottom, rgba(247,243,234,0.1) 0%, transparent 30%, transparent 65%, rgba(247,243,234,0.95) 100%);
  }
  .half.right::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to left, rgba(247,243,234,0) 0%, rgba(247,243,234,0.18) 100%),
      linear-gradient(to bottom, rgba(247,243,234,0.1) 0%, transparent 30%, transparent 65%, rgba(247,243,234,0.95) 100%);
  }

  /* City tags on photos */
  .city-tag {
    position: absolute;
    top: 42px;
    z-index: 10;
    font-family: 'Cinzel', serif;
    font-size: 7px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(247,243,234,0.85);
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }
  .left  .city-tag { left: 14px; }
  .right .city-tag { right: 14px; text-align: right; }

  /* Seam */
  .seam {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 100%;
    z-index: 20;
    background: linear-gradient(
      to bottom,
      rgba(122,158,118,0.0) 0%,
      rgba(122,158,118,0.5) 20%,
      rgba(122,158,118,0.9) 45%,
      rgba(122,158,118,0.9) 55%,
      rgba(122,158,118,0.3) 80%,
      rgba(122,158,118,0.0) 100%
    );
  }

  .seam-diamond {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    z-index: 25;
    width: 7px; height: 7px;
    background: var(--cream);
    border: 1.5px solid var(--sage);
    box-shadow: 0 0 8px rgba(122,158,118,0.4);
  }

  /* ── LOWER CONTENT AREA ── */
  .lower {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 46%;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px 24px;
    gap: 0;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 6.5px;
    letter-spacing: 5px;
    color: var(--sage);
    display: block;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .names-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
    gap: 0;
  }

  .name {
    font-family: 'Playfair Display', 'Cormorant Garamond', serif;
    font-size: 58px;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
    letter-spacing: -1px;
    line-height: 1;
    display: block;
  }

  .amp-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 3px 0;
  }
  .amp-line {
    height: 1px;
    width: 28px;
    background: linear-gradient(to right, transparent, var(--sage-light));
  }
  .amp-line.rev {
    background: linear-gradient(to left, transparent, var(--sage-light));
  }
  .amp {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-style: italic;
    color: var(--sage);
    line-height: 1;
  }

  .date-block {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .date-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 4px;
    color: var(--text-light);
  }
  .sage-rule {
    width: 36px; height: 1px;
    background: var(--sage-light);
  }
  .location-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 5px;
    color: var(--sage);
  }

  .scroll-hint {
    position: absolute;
    bottom: 14px;
    left: 50%; transform: translateX(-50%);
    z-index: 30;
    text-align: center;
  }
  .scroll-hint .label {
    font-family: 'Cinzel', serif;
    font-size: 6px;
    letter-spacing: 4px;
    color: var(--sage-light);
    display: block;
    margin-bottom: 2px;
  }
  .chevron {
    color: var(--sage-light);
    font-size: 10px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:0.4; transform:translateY(0); }
    50%      { opacity:1;   transform:translateY(3px); }
  }

  /* Palette */
  .palette {
    margin-top: 28px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .swatch-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .swatch {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .swatch-label {
    font-family: 'Cinzel', serif;
    font-size: 6px;
    letter-spacing: 1px;
    color: #7a9070;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="page-title">TFTF & RORO</div>
<div class="page-sub">Sage · Cream · Cairo × Luxor</div>

<div class="phone">
  <div class="screen">

    <div class="split">
      <div class="half left">
        <img src="https://images.unsplash.com/photo-1572252009286-96b070b6e90b?auto=format&fit=crop&w=400&h=420&q=85" alt="Cairo"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#c8d4c4,#a8bcA4);display:block'"/>
        <span class="city-tag">CAIRO</span>
      </div>
      <div class="half right">
        <img src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=400&h=420&q=85" alt="Luxor"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#c8d4c4,#a8bcA4);display:block'"/>
        <span class="city-tag">LUXOR</span>
      </div>
      <div class="seam">
        <div class="seam-diamond"></div>
      </div>
    </div>

    <div class="lower">
      <span class="eyebrow">ENGAGEMENT</span>
      <div class="names-block">
        <span class="name">TFTF</span>
        <div class="amp-row">
          <div class="amp-line rev"></div>
          <span class="amp">&</span>
          <div class="amp-line"></div>
        </div>
        <span class="name">RORO</span>
      </div>
      <div class="date-block">
        <span class="date-text">3 · JULY · 2026</span>
        <div class="sage-rule"></div>
        <span class="location-text">LUXOR</span>
      </div>
    </div>

    <div class="scroll-hint">
      <span class="label">SCROLL</span>
      <div class="chevron">▾</div>
    </div>

  </div>
</div>

<div class="palette">
  <div class="swatch-wrap">
    <div class="swatch" style="background:#7A9E76"></div>
    <div class="swatch-label">SAGE<br>#7A9E76</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#A8C4A4"></div>
    <div class="swatch-label">LIGHT SAGE<br>#A8C4A4</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#D4E6D1"></div>
    <div class="swatch-label">PALE SAGE<br>#D4E6D1</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#F7F3EA;border-color:#c8c0b0"></div>
    <div class="swatch-label">CREAM<br>#F7F3EA</div>
  </div>
</div>

</body>
</html>
