<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFTF & RORO — Mint</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --mint:        #98E8B0;   /* true mint green */
    --mint-bright: #B8F5CC;   /* light mint */
    --mint-glow:   #6DC98A;   /* deeper mint for glow */
    --offwhite:    #F6F3EC;   /* warm off-white */
    --dark:        #060C07;   /* near-black with green tint */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px 20px 50px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .page-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--mint);
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .page-sub {
    font-size: 13px;
    color: #3a4d3c;
    text-align: center;
    margin-bottom: 36px;
    font-style: italic;
    color: #557055;
  }

  .phone {
    width: 340px;
    height: 700px;
    background: #000;
    border-radius: 46px;
    border: 2px solid #0f1c10;
    box-shadow:
      0 0 0 1px #1a2e1c,
      0 50px 100px rgba(0,0,0,0.9),
      0 0 60px rgba(100,200,120,0.04);
    overflow: hidden;
    position: relative;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px;
    background: #000;
    border-radius: 0 0 22px 22px;
    z-index: 200;
  }

  .screen { width: 100%; height: 100%; position: relative; overflow: hidden; }

  .split { width: 100%; height: 100%; display: flex; }

  .half { position: relative; overflow: hidden; flex: 1; }
  .half img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .half.left  img { object-position: 60% center; }
  .half.right img { object-position: 40% center; }

  /* Green-tinted dark overlays */
  .half.left::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, rgba(4,18,8,0.5) 0%, rgba(4,18,8,0.68) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 30%, transparent 68%, rgba(0,0,0,0.6) 100%);
  }
  .half.right::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to left, rgba(4,18,8,0.5) 0%, rgba(4,18,8,0.68) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 30%, transparent 68%, rgba(0,0,0,0.6) 100%);
  }

  .city-tag {
    position: absolute;
    bottom: 52px;
    z-index: 10;
    font-family: 'Cinzel', serif;
    font-size: 7px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(152, 232, 176, 0.65);
  }
  .left  .city-tag { left: 14px; }
  .right .city-tag { right: 14px; text-align: right; }

  /* Mint seam */
  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    z-index: 20;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(152,232,176,0.08) 8%,
      rgba(152,232,176,0.45) 28%,
      rgba(152,232,176,0.95) 44%,
      #98E8B0 50%,
      rgba(152,232,176,0.95) 56%,
      rgba(152,232,176,0.45) 72%,
      rgba(152,232,176,0.08) 92%,
      transparent 100%
    );
  }

  .seam-diamond {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    z-index: 25;
    width: 7px; height: 7px;
    background: var(--mint-bright);
    box-shadow:
      0 0 10px rgba(152,232,176,1),
      0 0 25px rgba(152,232,176,0.6),
      0 0 50px rgba(100,200,130,0.3);
  }

  /* Center block */
  .center-block {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    text-align: center;
    width: 100%;
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 6.5px;
    letter-spacing: 5px;
    color: var(--mint);
    opacity: 0.85;
    display: block;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 60px;
    font-weight: 300;
    font-style: italic;
    line-height: 1;
    letter-spacing: -1px;
    color: var(--offwhite);
    text-shadow:
      0 0 40px rgba(90,200,120,0.25),
      0 2px 30px rgba(0,0,0,0.98),
      0 4px 60px rgba(0,0,0,0.9);
    display: block;
  }

  .amp-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 6px 0;
  }
  .amp-line {
    height: 1px;
    width: 26px;
    background: linear-gradient(to right, transparent, rgba(152,232,176,0.5));
  }
  .amp-line.rev {
    background: linear-gradient(to left, transparent, rgba(152,232,176,0.5));
  }
  .amp {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-style: italic;
    color: var(--mint);
    text-shadow: 0 0 18px rgba(152,232,176,0.8);
    line-height: 1;
  }

  .date-block {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .date-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 4px;
    color: rgba(246,243,236,0.55);
    text-shadow: 0 1px 10px rgba(0,0,0,1);
  }
  .mint-rule {
    width: 36px; height: 1px;
    background: var(--mint);
    opacity: 0.6;
  }
  .location-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 5px;
    color: var(--mint);
    opacity: 0.85;
    text-shadow: 0 1px 10px rgba(0,0,0,1);
  }

  .scroll-hint {
    position: absolute;
    bottom: 18px;
    left: 50%; transform: translateX(-50%);
    z-index: 30;
    text-align: center;
  }
  .scroll-hint .label {
    font-family: 'Cinzel', serif;
    font-size: 6px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.2);
    display: block;
    margin-bottom: 3px;
  }
  .chevron {
    color: rgba(152,232,176,0.5);
    font-size: 10px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:0.3; transform:translateY(0); }
    50%      { opacity:0.9; transform:translateY(3px); }
  }

  /* Palette strip */
  .palette {
    margin-top: 28px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .swatch-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .swatch {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .swatch-label {
    font-family: 'Cinzel', serif;
    font-size: 6.5px;
    letter-spacing: 1.5px;
    color: #3a5040;
    text-align: center;
  }
</style>
</head>
<body>

<div class="page-title">TFTF & RORO</div>
<div class="page-sub">Mint green · Off-white · Cairo × Luxor</div>

<div class="phone">
  <div class="screen">
    <div class="split">
      <div class="half left">
        <img src="https://images.unsplash.com/photo-1572252009286-96b070b6e90b?auto=format&fit=crop&w=400&h=700&q=85" alt="Cairo"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#061208,#030a04);display:block'"/>
        <span class="city-tag">CAIRO</span>
      </div>
      <div class="half right">
        <img src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=400&h=700&q=85" alt="Luxor"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#061208,#030a04);display:block'"/>
        <span class="city-tag">LUXOR</span>
      </div>
    </div>

    <div class="seam"></div>
    <div class="seam-diamond"></div>

    <div class="center-block">
      <span class="eyebrow">ENGAGEMENT</span>
      <span class="name">TFTF</span>
      <div class="amp-row">
        <div class="amp-line rev"></div>
        <span class="amp">&</span>
        <div class="amp-line"></div>
      </div>
      <span class="name">RORO</span>
      <div class="date-block">
        <span class="date-text">3 · JULY · 2026</span>
        <div class="mint-rule"></div>
        <span class="location-text">LUXOR</span>
      </div>
    </div>

    <div class="scroll-hint">
      <span class="label">SCROLL</span>
      <div class="chevron">▾</div>
    </div>
  </div>
</div>

<div class="palette">
  <div class="swatch-wrap">
    <div class="swatch" style="background:#98E8B0"></div>
    <div class="swatch-label">#98E8B0<br>MINT</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#B8F5CC"></div>
    <div class="swatch-label">#B8F5CC<br>LIGHT MINT</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#F6F3EC"></div>
    <div class="swatch-label">#F6F3EC<br>OFF-WHITE</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#060C07;border-color:#1a2e1c"></div>
    <div class="swatch-label">#060C07<br>DARK</div>
  </div>
</div>

</body>
</html>
