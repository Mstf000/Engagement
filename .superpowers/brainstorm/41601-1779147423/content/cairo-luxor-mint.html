<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFTF & RORO — Mint & Offwhite</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0f0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px 20px 50px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .page-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: #7ecfb0;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .page-sub {
    font-size: 13px;
    color: #556;
    text-align: center;
    margin-bottom: 36px;
    font-style: italic;
  }

  .phone {
    width: 340px;
    height: 700px;
    background: #000;
    border-radius: 46px;
    border: 2px solid #1e2820;
    box-shadow:
      0 0 0 1px #2e3d35,
      0 50px 100px rgba(0,0,0,0.9),
      inset 0 0 0 1px #111;
    overflow: hidden;
    position: relative;
  }

  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px;
    background: #000;
    border-radius: 0 0 22px 22px;
    z-index: 200;
  }

  .screen {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .split {
    width: 100%;
    height: 100%;
    display: flex;
  }

  .half {
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  .half img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .half.left  img { object-position: 60% center; }
  .half.right img { object-position: 40% center; }

  /* Mint-tinted overlays */
  .half.left::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right,  rgba(10,30,22,0.45) 0%, rgba(5,20,15,0.65) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.55) 100%);
  }

  .half.right::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to left,  rgba(10,30,22,0.45) 0%, rgba(5,20,15,0.65) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.55) 100%);
  }

  .city-tag {
    position: absolute;
    bottom: 52px;
    z-index: 10;
    font-family: 'Cinzel', serif;
    font-size: 7px;
    letter-spacing: 5px;
    text-transform: uppercase;
  }
  .left  .city-tag { left: 14px;  color: rgba(180, 235, 210, 0.7); }
  .right .city-tag { right: 14px; color: rgba(180, 235, 210, 0.7); text-align: right; }

  /* Mint seam */
  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    z-index: 20;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(126,207,176,0.1) 8%,
      rgba(126,207,176,0.5) 28%,
      rgba(126,207,176,0.9) 44%,
      rgba(126,207,176,1)   50%,
      rgba(126,207,176,0.9) 56%,
      rgba(126,207,176,0.5) 72%,
      rgba(126,207,176,0.1) 92%,
      transparent 100%
    );
  }

  .seam-diamond {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    z-index: 25;
    width: 7px;
    height: 7px;
    background: #a8e8cc;
    box-shadow: 0 0 14px rgba(126,207,176,0.9), 0 0 28px rgba(126,207,176,0.4);
  }

  /* Center names */
  .center-block {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    text-align: center;
    width: 100%;
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 6.5px;
    letter-spacing: 5px;
    color: rgba(168, 232, 204, 0.8);
    display: block;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  /* Both names in offwhite — unified, clean */
  .name-tftf {
    font-family: 'Cormorant Garamond', serif;
    font-size: 58px;
    font-weight: 300;
    font-style: italic;
    line-height: 1;
    letter-spacing: -1px;
    color: #f5f2ec;
    text-shadow:
      0 0 50px rgba(126,207,176,0.35),
      0 2px 30px rgba(0,0,0,0.95),
      0 4px 60px rgba(0,0,0,0.8);
    display: block;
  }

  .amp-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 5px 0;
  }
  .amp-line {
    height: 1px;
    width: 26px;
    background: linear-gradient(to right, transparent, rgba(126,207,176,0.55));
  }
  .amp-line.rev {
    background: linear-gradient(to left, transparent, rgba(126,207,176,0.55));
  }
  .amp {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    color: #7ecfb0;
    text-shadow: 0 0 20px rgba(126,207,176,0.7);
    line-height: 1;
  }

  .name-roro {
    font-family: 'Cormorant Garamond', serif;
    font-size: 58px;
    font-weight: 300;
    font-style: italic;
    line-height: 1;
    letter-spacing: -1px;
    color: #f5f2ec;
    text-shadow:
      0 0 50px rgba(126,207,176,0.35),
      0 2px 30px rgba(0,0,0,0.95),
      0 4px 60px rgba(0,0,0,0.8);
    display: block;
  }

  .date-block {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .date-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 4px;
    color: rgba(240, 237, 230, 0.6);
    text-shadow: 0 1px 10px rgba(0,0,0,1);
  }
  .mint-rule {
    width: 36px;
    height: 1px;
    background: #7ecfb0;
    opacity: 0.65;
  }
  .location-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 5px;
    color: rgba(168,232,204,0.85);
    text-shadow: 0 1px 10px rgba(0,0,0,1);
  }

  .scroll-hint {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    text-align: center;
  }
  .scroll-hint .label {
    font-family: 'Cinzel', serif;
    font-size: 6px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.25);
    display: block;
    margin-bottom: 3px;
  }
  .scroll-hint .chevron {
    color: rgba(126,207,176,0.45);
    font-size: 10px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:0.3; transform:translateY(0); }
    50%      { opacity:0.85; transform:translateY(3px); }
  }

  /* Palette swatch strip below phone */
  .palette {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .swatch {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .swatch-label {
    font-family: 'Cinzel', serif;
    font-size: 7px;
    letter-spacing: 2px;
    color: #555;
    text-align: center;
    margin-top: 4px;
  }
  .swatch-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>

<div class="page-title">TFTF & RORO</div>
<div class="page-sub">Mint green · Off-white · Cairo × Luxor</div>

<div class="phone">
  <div class="screen">
    <div class="split">

      <div class="half left">
        <img
          src="https://images.unsplash.com/photo-1572252009286-96b070b6e90b?auto=format&fit=crop&w=400&h=700&q=85"
          alt="Cairo"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#0d1f17 0%,#071510 100%);display:block'"
        />
        <span class="city-tag">CAIRO</span>
      </div>

      <div class="half right">
        <img
          src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=400&h=700&q=85"
          alt="Luxor"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#0d1f17 0%,#071510 100%);display:block'"
        />
        <span class="city-tag">LUXOR</span>
      </div>
    </div>

    <div class="seam"></div>
    <div class="seam-diamond"></div>

    <div class="center-block">
      <span class="eyebrow">ENGAGEMENT</span>
      <span class="name-tftf">TFTF</span>
      <div class="amp-row">
        <div class="amp-line rev"></div>
        <span class="amp">&</span>
        <div class="amp-line"></div>
      </div>
      <span class="name-roro">RORO</span>
      <div class="date-block">
        <span class="date-text">3 · JULY · 2026</span>
        <div class="mint-rule"></div>
        <span class="location-text">LUXOR</span>
      </div>
    </div>

    <div class="scroll-hint">
      <span class="label">SCROLL</span>
      <div class="chevron">▾</div>
    </div>
  </div>
</div>

<!-- Palette -->
<div class="palette">
  <div class="swatch-wrap">
    <div class="swatch" style="background:#7ecfb0"></div>
    <div class="swatch-label">MINT</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#f5f2ec"></div>
    <div class="swatch-label">OFFWHITE</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#0a0f0d"></div>
    <div class="swatch-label">DEEP</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#a8e8cc"></div>
    <div class="swatch-label">LIGHT MINT</div>
  </div>
</div>

</body>
</html>
