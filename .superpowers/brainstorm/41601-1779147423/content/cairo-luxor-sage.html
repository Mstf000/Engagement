<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFTF & RORO — Sage</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage:        #8BAD85;   /* dusty sage green */
    --sage-light:  #BDD4B8;   /* pale sage */
    --sage-deep:   #5E7D59;   /* deeper sage for accents */
    --cream:       #F4F0E6;   /* warm off-white/cream */
    --cream-dark:  #E8E2D4;   /* slightly darker cream */
    --dark:        #1E271D;   /* deep forest for text */
    --dark-bg:     #0C1209;   /* near-black with green tint */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e1509;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px 20px 50px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .page-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--sage-light);
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .page-sub {
    font-size: 13px;
    color: #446040;
    text-align: center;
    margin-bottom: 36px;
    font-style: italic;
  }

  /* Phone */
  .phone {
    width: 340px;
    height: 700px;
    background: #000;
    border-radius: 46px;
    border: 2px solid #111a0f;
    box-shadow:
      0 0 0 1px #1c2a18,
      0 50px 100px rgba(0,0,0,0.9);
    overflow: hidden;
    position: relative;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px;
    background: #000;
    border-radius: 0 0 22px 22px;
    z-index: 200;
  }

  .screen { width: 100%; height: 100%; position: relative; overflow: hidden; }

  /* Split */
  .split { width: 100%; height: 100%; display: flex; }
  .half { position: relative; overflow: hidden; flex: 1; }
  .half img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .half.left  img { object-position: 60% center; }
  .half.right img { object-position: 40% center; }

  /* Sage-tinted dark overlays */
  .half.left::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, rgba(8,18,7,0.55) 0%, rgba(8,18,7,0.72) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 28%, transparent 68%, rgba(0,0,0,0.65) 100%);
  }
  .half.right::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to left, rgba(8,18,7,0.55) 0%, rgba(8,18,7,0.72) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 28%, transparent 68%, rgba(0,0,0,0.65) 100%);
  }

  .city-tag {
    position: absolute;
    bottom: 52px;
    z-index: 10;
    font-family: 'Cinzel', serif;
    font-size: 7px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(189, 212, 184, 0.65);
  }
  .left  .city-tag { left: 14px; }
  .right .city-tag { right: 14px; text-align: right; }

  /* Sage seam */
  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    z-index: 20;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(139,173,133,0.08) 8%,
      rgba(139,173,133,0.4)  28%,
      rgba(139,173,133,0.9)  44%,
      #BDD4B8 50%,
      rgba(139,173,133,0.9)  56%,
      rgba(139,173,133,0.4)  72%,
      rgba(139,173,133,0.08) 92%,
      transparent 100%
    );
  }

  .seam-diamond {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    z-index: 25;
    width: 7px; height: 7px;
    background: var(--sage-light);
    box-shadow:
      0 0 10px rgba(189,212,184,1),
      0 0 24px rgba(139,173,133,0.6),
      0 0 48px rgba(100,150,95,0.3);
  }

  /* Center block */
  .center-block {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    text-align: center;
    width: 100%;
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 6.5px;
    letter-spacing: 5px;
    color: var(--sage-light);
    opacity: 0.85;
    display: block;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .name {
    font-family: 'Playfair Display', 'Cormorant Garamond', serif;
    font-size: 62px;
    font-weight: 400;
    font-style: italic;
    line-height: 1;
    letter-spacing: -1px;
    color: var(--cream);
    text-shadow:
      0 0 50px rgba(94,125,89,0.3),
      0 2px 30px rgba(0,0,0,0.98),
      0 4px 70px rgba(0,0,0,0.9);
    display: block;
  }

  .amp-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 6px 0;
  }
  .amp-line {
    height: 1px;
    width: 26px;
    background: linear-gradient(to right, transparent, rgba(139,173,133,0.5));
  }
  .amp-line.rev {
    background: linear-gradient(to left, transparent, rgba(139,173,133,0.5));
  }
  .amp {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-style: italic;
    color: var(--sage-light);
    text-shadow: 0 0 18px rgba(189,212,184,0.7);
    line-height: 1;
  }

  .date-block {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .date-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 4px;
    color: rgba(244,240,230,0.55);
    text-shadow: 0 1px 10px rgba(0,0,0,1);
  }
  .sage-rule {
    width: 36px; height: 1px;
    background: var(--sage);
    opacity: 0.65;
  }
  .location-text {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 5px;
    color: var(--sage-light);
    opacity: 0.85;
    text-shadow: 0 1px 10px rgba(0,0,0,1);
  }

  .scroll-hint {
    position: absolute;
    bottom: 18px;
    left: 50%; transform: translateX(-50%);
    z-index: 30;
    text-align: center;
  }
  .scroll-hint .label {
    font-family: 'Cinzel', serif;
    font-size: 6px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.2);
    display: block;
    margin-bottom: 3px;
  }
  .chevron {
    color: rgba(189,212,184,0.45);
    font-size: 10px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:0.3; transform:translateY(0); }
    50%      { opacity:0.85; transform:translateY(3px); }
  }

  /* Palette */
  .palette {
    margin-top: 28px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .swatch-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .swatch {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .swatch-label {
    font-family: 'Cinzel', serif;
    font-size: 6px;
    letter-spacing: 1px;
    color: #3a5038;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="page-title">TFTF & RORO</div>
<div class="page-sub">Sage green · Cream · Cairo × Luxor</div>

<div class="phone">
  <div class="screen">
    <div class="split">
      <div class="half left">
        <img src="https://images.unsplash.com/photo-1572252009286-96b070b6e90b?auto=format&fit=crop&w=400&h=700&q=85" alt="Cairo"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#0a1609,#050d04);display:block'"/>
        <span class="city-tag">CAIRO</span>
      </div>
      <div class="half right">
        <img src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=400&h=700&q=85" alt="Luxor"
          onerror="this.style.cssText='width:100%;height:100%;background:linear-gradient(160deg,#0a1609,#050d04);display:block'"/>
        <span class="city-tag">LUXOR</span>
      </div>
    </div>

    <div class="seam"></div>
    <div class="seam-diamond"></div>

    <div class="center-block">
      <span class="eyebrow">ENGAGEMENT</span>
      <span class="name">TFTF</span>
      <div class="amp-row">
        <div class="amp-line rev"></div>
        <span class="amp">&</span>
        <div class="amp-line"></div>
      </div>
      <span class="name">RORO</span>
      <div class="date-block">
        <span class="date-text">3 · JULY · 2026</span>
        <div class="sage-rule"></div>
        <span class="location-text">LUXOR</span>
      </div>
    </div>

    <div class="scroll-hint">
      <span class="label">SCROLL</span>
      <div class="chevron">▾</div>
    </div>
  </div>
</div>

<!-- Palette reference -->
<div class="palette">
  <div class="swatch-wrap">
    <div class="swatch" style="background:#8BAD85"></div>
    <div class="swatch-label">SAGE<br>#8BAD85</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#BDD4B8"></div>
    <div class="swatch-label">PALE SAGE<br>#BDD4B8</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#F4F0E6;border-color:#c5bfb0"></div>
    <div class="swatch-label">CREAM<br>#F4F0E6</div>
  </div>
  <div class="swatch-wrap">
    <div class="swatch" style="background:#5E7D59"></div>
    <div class="swatch-label">DEEP SAGE<br>#5E7D59</div>
  </div>
</div>

</body>
</html>
