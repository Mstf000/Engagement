<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Section Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sage:     #7B9E77;
  --sage-mid: #9DC49A;
  --sage-pale:#EAF5E8;
  --sage-bg:  #F2FAF1;
  --white:    #FFFFFF;
  --text:     #1E2E1C;
  --text-mid: #5A7A58;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#fff;
  display:flex; flex-direction:column; align-items:center;
  padding:40px 20px 60px; font-family:'Cormorant Garamond',serif;
  gap:16px;
}
h2 { font-family:'Cinzel',serif; font-size:10px; letter-spacing:5px; color:var(--sage); text-transform:uppercase; margin-bottom:4px; }
.sub { font-size:13px; color:#aaa; font-style:italic; margin-bottom:20px; }

.phone {
  width:340px; height:540px;
  background:var(--white);
  border-radius:28px;
  border:1px solid #d8edd6;
  box-shadow:0 4px 24px rgba(80,140,76,0.1);
  overflow:hidden;
}
.phone-inner { width:100%; height:100%; overflow:hidden; }

/* ── MAP SECTION ── */
.map-section {
  background:var(--white);
  padding:36px 24px 32px;
  display:flex; flex-direction:column; align-items:center;
  gap:6px; text-align:center;
}

.s-eye   { font-family:'Cinzel',serif; font-size:7px; letter-spacing:5px; color:var(--sage); text-transform:uppercase; }
.s-title { font-family:'Playfair Display',serif; font-size:22px; font-style:italic; color:var(--text); margin-bottom:4px; line-height:1.3; }

/* SVG map container */
.map-wrap {
  width:260px; height:300px;
  position:relative; margin:8px 0;
}

.map-wrap svg { width:100%; height:100%; overflow:visible; }

/* city dots */
.city-dot {
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%,100% { r:5; opacity:1; }
  50%      { r:7; opacity:0.7; }
}

/* animated travel line */
.travel-line {
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  animation: drawPath 2s ease-in-out 0.5s forwards;
}
@keyframes drawPath {
  to { stroke-dashoffset: 0; }
}

/* plane/heart travels along path */
.traveler {
  animation: moveAlong 2s ease-in-out 0.5s forwards;
  opacity: 0;
}
@keyframes moveAlong {
  0%   { offset-distance:0%;   opacity:0; }
  5%   { opacity:1; }
  95%  { opacity:1; }
  100% { offset-distance:100%; opacity:1; }
}

/* city labels */
.city-label-cairo {
  animation: fadeIn 0.5s ease 1s both;
}
.city-label-luxor {
  animation: fadeIn 0.5s ease 2.5s both;
}
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

/* distance badge */
.distance-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:var(--sage-bg); border:1px solid #d0e8ce;
  border-radius:20px; padding:8px 18px; margin-top:4px;
  animation: fadeIn 0.6s ease 2.8s both;
}
.dist-num { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; color:var(--sage); line-height:1; }
.dist-unit { font-family:'Cinzel',serif; font-size:7px; letter-spacing:3px; color:var(--text-mid); text-transform:uppercase; line-height:1.4; }

.map-caption {
  font-family:'Cormorant Garamond',serif; font-size:15px;
  font-style:italic; color:var(--text-mid); line-height:1.6;
  animation:fadeIn 0.6s ease 3.2s both;
}
</style>
</head>
<body>

<h2>Map Section Preview</h2>
<div class="sub">How it appears in the site — animates on scroll</div>

<div class="phone">
  <div class="phone-inner">
    <div class="map-section">
      <span class="s-eye">OUR STORY</span>
      <div class="s-title">Two Cities, One Love</div>

      <div class="map-wrap">
        <svg viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">

          <!-- Egypt outline — simplified but recognisable -->
          <path
            d="M 78,8
               L 110,8  L 118,14  L 124,12  L 130,18
               L 145,20 L 155,28  L 158,38  L 162,44
               L 165,52 L 168,62  L 170,72  L 168,82
               L 164,90 L 162,100 L 165,108 L 162,118
               L 158,126 L 152,130 L 148,138 L 144,148
               L 140,158 L 136,168 L 130,176 L 122,184
               L 114,190 L 108,198 L 102,210 L 96,222
               L 90,230  L 84,238  L 78,244  L 72,248
               L 64,244  L 58,236  L 52,226  L 46,212
               L 42,200  L 40,190  L 38,178  L 36,166
               L 34,154  L 32,142  L 30,130  L 28,118
               L 26,106  L 24,94   L 24,82   L 26,70
               L 30,60   L 36,52   L 42,44   L 50,36
               L 58,28   L 66,20   L 72,14   Z"
            fill="#EAF5E8"
            stroke="#9DC49A"
            stroke-width="1.2"
          />

          <!-- Nile river — gentle wavy path through Egypt -->
          <path
            d="M 96,222 C 94,210 92,198 90,186 C 88,174 88,162 90,150
               C 92,138 96,128 98,118 C 100,108 100,98  98,88
               C 96,78  92,68  90,58  C 88,48  88,38  90,28"
            stroke="#A8D4E8" stroke-width="1.5" stroke-linecap="round"
            fill="none" opacity="0.6"
          />

          <!-- Cairo dot — north, near delta -->
          <circle cx="92" cy="46" r="5" fill="var(--sage)" class="city-dot"/>
          <!-- Cairo ripple rings -->
          <circle cx="92" cy="46" r="10" fill="none" stroke="var(--sage)" stroke-width="0.8" opacity="0.3">
            <animate attributeName="r" values="5;16" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
          </circle>

          <!-- Luxor dot — upper egypt, south -->
          <circle cx="104" cy="172" r="5" fill="var(--sage)" class="city-dot" style="animation-delay:0.5s"/>
          <circle cx="104" cy="172" r="10" fill="none" stroke="var(--sage)" stroke-width="0.8" opacity="0.3">
            <animate attributeName="r" values="5;16" dur="2s" begin="0.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
          </circle>

          <!-- Animated dashed line Cairo → Luxor (slightly curved) -->
          <path
            id="routePath"
            d="M 92,46 C 80,80 78,120 88,150 C 94,162 98,166 104,172"
            stroke="var(--sage)" stroke-width="1.5" stroke-linecap="round"
            stroke-dasharray="5 4" fill="none"
            class="travel-line"
          />

          <!-- Travelling heart along the path -->
          <text font-size="12" text-anchor="middle" style="offset-path:path('M 92,46 C 80,80 78,120 88,150 C 94,162 98,166 104,172'); offset-distance:0%; animation:moveAlong 2s ease-in-out 0.5s forwards; opacity:0">
            🤍
          </text>

          <!-- CAIRO label -->
          <g class="city-label-cairo">
            <text x="100" y="44" font-family="Cinzel, serif" font-size="7" fill="var(--text)" letter-spacing="2" font-weight="400">CAIRO</text>
            <text x="100" y="53" font-family="Cormorant Garamond, serif" font-size="7" fill="var(--text-mid)" font-style="italic">Mostafa</text>
          </g>

          <!-- LUXOR label -->
          <g class="city-label-luxor">
            <text x="112" y="170" font-family="Cinzel, serif" font-size="7" fill="var(--text)" letter-spacing="2">LUXOR</text>
            <text x="112" y="179" font-family="Cormorant Garamond, serif" font-size="7" fill="var(--text-mid)" font-style="italic">Nourhanne</text>
          </g>

          <!-- Mediterranean label -->
          <text x="32" y="22" font-family="Cormorant Garamond, serif" font-size="6.5" fill="#A8D4E8" font-style="italic" opacity="0.9">Mediterranean</text>

          <!-- Red Sea label -->
          <text x="148" y="90" font-family="Cormorant Garamond, serif" font-size="6" fill="#A8D4E8" font-style="italic" opacity="0.8" transform="rotate(75,148,90)">Red Sea</text>
        </svg>
      </div>

      <!-- Distance badge -->
      <div class="distance-badge">
        <div class="dist-num">500</div>
        <div class="dist-unit">km<br>apart</div>
        <div style="width:1px;height:24px;background:#d0e8ce;margin:0 4px"></div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:var(--text-mid);line-height:1.3">one<br>heart</div>
      </div>

      <p class="map-caption">He came from the north.<br>She waited in the south.<br>Luxor brought them together.</p>
    </div>
  </div>
</div>

</body>
</html>
